{% extends 'estoque/base.html' %} {% block content %}

<h1>Depósitos</h1>

<a href="{% url 'deposito_create' %}" class="btn"> Novo depósito </a>

<table>
  <thead>
    <tr>
      <th>Nome</th>
      <th>Localização</th>
      <th>Ações</th>
    </tr>
  </thead>

  <tbody>
    {% for deposito in depositos %}
    <tr>
      <td>{{ deposito.nome }}</td>
      <td>{{ deposito.localizacao }}</td>

      <td>
        <a href="{% url 'deposito_update' deposito.pk %}"> Editar </a>

        |

        <a href="{% url 'deposito_delete' deposito.pk %}"> Excluir </a>
      </td>
    </tr>

    {% empty %}
    <tr>
      <td colspan="3">Nenhum depósito cadastrado.</td>
    </tr>
    {% endfor %}
  </tbody>
</table>

{% endblock %}
