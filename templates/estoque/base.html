<!doctype html>
<html lang="pt-br">
  <head>
    <meta charset="UTF-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>{% block title %} Controle de Estoque {% endblock %}</title>

    <style>
      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #f4f6f8;
        color: #222;
      }

      nav {
        background: #222;
        padding: 15px 25px;
      }

      nav a {
        color: white;
        text-decoration: none;
        margin-right: 20px;
        font-weight: bold;
      }

      nav a:hover {
        text-decoration: underline;
      }

      .container {
        max-width: 1100px;
        margin: 30px auto;
        padding: 0 20px;
      }

      h1,
      h2 {
        color: #222;
      }

      .cards {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
        gap: 20px;
        margin: 25px 0;
      }

      .card {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      .card h2 {
        margin-top: 0;
      }

      .number {
        font-size: 32px;
        font-weight: bold;
      }

      .btn {
        display: inline-block;
        padding: 9px 14px;
        background: #222;
        color: white;
        text-decoration: none;
        border-radius: 6px;
        border: none;
        cursor: pointer;
        margin: 3px;
      }

      .btn:hover {
        opacity: 0.85;
      }

      .btn-danger {
        background: #b42318;
      }

      .btn-success {
        background: #16803c;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        background: white;
        margin-top: 20px;
      }

      th,
      td {
        padding: 12px;
        border-bottom: 1px solid #ddd;
        text-align: left;
      }

      th {
        background: #eee;
      }

      form {
        background: white;
        padding: 25px;
        border-radius: 10px;
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
      }

      form p {
        display: flex;
        flex-direction: column;
        margin-bottom: 15px;
      }

      input,
      select {
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #bbb;
        border-radius: 5px;
      }

      .alert {
        padding: 12px;
        margin-bottom: 20px;
        background: #dff5e5;
        border-radius: 6px;
      }

      .baixo {
        background: #ffe0e0;
      }

      .acoes {
        white-space: nowrap;
      }
    </style>
  </head>

  <body>
    <nav>
      <a href="{% url 'home' %}"> Controle de Estoque </a>

      <a href="{% url 'produto_list' %}"> Produtos </a>

      <a href="{% url 'fornecedor_list' %}"> Fornecedores </a>

      <a href="{% url 'deposito_list' %}"> Depósitos </a>

      <a href="{% url 'movimentacao_list' %}"> Movimentações </a>

      <a href="{% url 'estoque' %}"> Estoque </a>

      <a href="/admin/"> Admin </a>
    </nav>

    <div class="container">
      {% if messages %} {% for message in messages %}
      <div class="alert">{{ message }}</div>
      {% endfor %} {% endif %} {% block content %} {% endblock %}
    </div>
  </body>
</html>
